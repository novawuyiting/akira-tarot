name: Publish article from issue

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to publish"
        required: true
        type: number

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'publish-article')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write issue content
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issueNumber = context.eventName === "workflow_dispatch"
              ? Number(core.getInput("issue_number"))
              : context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            fs.writeFileSync("issue-content.json", JSON.stringify(issue, null, 2));

      - name: Build article page
        run: node scripts/publish-article-from-issue.js issue-content.json

      - name: Commit article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f issue-content.json
          git add content/articles.json index.html sitemap.xml *.html
          if git diff --cached --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "Publish article from issue"
            git push
          fi

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === "workflow_dispatch"
              ? Number(core.getInput("issue_number"))
              : context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "Published or updated the article page from this issue. The site will refresh after GitHub Pages finishes deploying.",
            });
